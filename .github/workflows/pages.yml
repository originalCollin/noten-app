# Veröffentlicht die Web-App (Ordner web/) kostenlos über GitHub Pages.
# Läuft automatisch, sobald Änderungen im Hauptzweig "main" landen.
# Einmalig nötig: Im Repository unter Settings → Pages bei "Source" die Option
# "GitHub Actions" auswählen (siehe docs/ANLEITUNG-WEB.md).
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
